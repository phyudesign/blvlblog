name: 상품 사진 배경 지우기
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  cutout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: python _tools/cutout.py
      - run: |
          git config user.name "blvl-thumbnail-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/products assets/art; git commit -m "상품 사진 배경 지우기" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
